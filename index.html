        function App() {
            const [selectedScenario, setSelectedScenario] = useState(SCENARIOS[0]);
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, stakeholders, proposal, debrief
            const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
            
            // Simulation State
            const [metrics, setMetrics] = useState(SCENARIOS[0].initialMetrics);
            const [stakeholders, setStakeholders] = useState(SCENARIOS[0].stakeholders);
            const [history, setHistory] = useState([]);
            const [isFinished, setIsFinished] = useState(false);
            const [selectedStakeholder, setSelectedStakeholder] = useState(SCENARIOS[0].stakeholders[0]);
            
            // Custom Proposal Builder State
            const [proposalParams, setProposalParams] = useState({
                budgetAllocation: 50,
                regulatorySafeguards: 50,
                communityCompensation: 30,
                executionSpeed: 60
            });

            // Handle switching scenario
            const handleScenarioChange = (scenarioId) => {
                const sc = SCENARIOS.find(s => s.id === scenarioId) || SCENARIOS[0];
                setSelectedScenario(sc);
                setMetrics(sc.initialMetrics);
                setStakeholders(sc.stakeholders);
                setSelectedStakeholder(sc.stakeholders[0]);
                setCurrentRoundIndex(0);
                setHistory([]);
                setIsFinished(false);
                setActiveTab('dashboard');
            };

            // Process Option Selection
            const handleSelectOption = (option) => {
                // Apply Metric Changes
                const newMetrics = { ...metrics };
                Object.keys(option.impact).forEach(key => {
                    newMetrics[key] = Math.max(0, Math.min(100, (newMetrics[key] || 0) + option.impact[key]));
                });

                // Apply Stakeholder Sentiment Changes
                const updatedStakeholders = stakeholders.map(sh => {
                    const change = option.sentimentChange[sh.id] || 0;
                    return {
                        ...sh,
                        sentiment: Math.max(-100, Math.min(100, sh.sentiment + change))
                    };
                });

                // Log History
                const logEntry = {
                    round: currentRoundIndex + 1,
                    dilemmaTitle: selectedScenario.rounds[currentRoundIndex].title,
                    chosenOption: option.text,
                    consequence: option.consequence,
                    impact: option.impact,
                    sentimentChange: option.sentimentChange
                };

                setMetrics(newMetrics);
                setStakeholders(updatedStakeholders);
                setHistory([...history, logEntry]);

                // Update selected stakeholder reference
                if (selectedStakeholder) {
                    const updatedSel = updatedStakeholders.find(s => s.id === selectedStakeholder.id);
                    if (updatedSel) setSelectedStakeholder(updatedSel);
                }

                // Advance Round or Finish
                if (currentRoundIndex + 1 < selectedScenario.rounds.length) {
                    setCurrentRoundIndex(currentRoundIndex + 1);
                } else {
                    setIsFinished(true);
                    setActiveTab('debrief');
                }
            };

            // Calculate overall alignment score (Weighted average of sentiments)
            const overallAlignment = useMemo(() => {
                const totalInfluence = stakeholders.reduce((acc, curr) => acc + curr.influence, 0);
                const weightedSentiment = stakeholders.reduce((acc, curr) => acc + (curr.sentiment * curr.influence), 0);
                return Math.round((weightedSentiment / (totalInfluence * 100)) * 100);
            }, [stakeholders]);

            // Helper function for sentiment color
            const getSentimentColor = (val) => {
                if (val >= 40) return 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
                if (val >= 0) return 'text-amber-400 bg-amber-500/10 border-amber-500/30';
                return 'text-rose-400 bg-rose-500/10 border-rose-500/30';
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    
                    {/* TOP NAVBAR */}
                    <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                                </div>

                                </div>
                            </div>

                            {/* Scenario Switcher Selector */}
                            <div className="flex items-center space-x-3">

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {stakeholders.map(sh => (
                                            <div key={sh.id} className="p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                                <div className="flex items-center space-x-3">
                                                    <span className="text-2xl">{sh.avatar}</span>
                                                    <div>
                                                        <h5 className="font-bold text-slate-200">{sh.name}</h5>
                                                        <p className="text-slate-400">{sh.role}</p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className={`px-2.5 py-1 rounded font-mono font-bold border ${getSentimentColor(sh.sentiment)}`}>
                                                        {sh.sentiment > 0 ? `+${sh.sentiment}` : sh.sentiment}
                                                    </span>
                                                    <div className="text-[10px] text-slate-500 mt-1">
                                                        {sh.sentiment >= 30 ? 'Strong Support' : sh.sentiment >= 0 ? 'Neutral Neutrality' : 'Opposed'}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* DECISION LOG AUDIT */}
                                <div className="space-y-3">
                                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400">Decision Audit Log</h4>
                                    {history.length === 0 ? (
                                        <p className="text-xs text-slate-500 italic">No decisions logged yet. Begin the scenario on the Decision Dashboard tab.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {history.map((h, i) => (
                                                <div key={i} className="p-4 bg-slate-900/80 rounded-xl border border-slate-800 text-xs space-y-1">
                                                    <div className="font-bold text-indigo-400">Stage {h.round}: {h.dilemmaTitle}</div>
                                                    <div className="text-slate-200 font-medium">Choice: {h.chosenOption}</div>
                                                    <p className="text-slate-400 italic mt-1">{h.consequence}</p>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
